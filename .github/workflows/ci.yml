name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  derleme:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Derle
        working-directory: Online Food Delivery App/src
        run: javac -encoding UTF-8 -d "$RUNNER_TEMP/out" *.java