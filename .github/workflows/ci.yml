name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  derleme-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Derle ve test et
        run: mvn -B verify
